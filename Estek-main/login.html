<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ESTEK | Giriş</title>
  <link rel="icon" href="./assets/estek_logo.jpg" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <!-- Background Effects -->
  <div class="login-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="login-grid"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <a href="index.html" class="login-logo">ESTEK</a>
        <span class="login-badge">Dashboard Girişi</span>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Kullanıcı Adı</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="username" required placeholder="Kullanıcı adınızı girin" autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Şifre</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" required placeholder="Şifrenizi girin" autocomplete="current-password">
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Şifreyi göster">
              <span id="eye-icon">👁️</span>
            </button>
          </div>
        </div>

        <div class="form-error" id="login-error" style="display:none;">
          <span>⚠️</span> Kullanıcı adı veya şifre hatalı!
        </div>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" id="remember-me"> Beni Hatırla
          </label>
          <a href="#" class="forgot-password" onclick="handleForgotPassword(event)">Şifremi Unuttum?</a>
        </div>

        <button type="submit" class="btn-login" id="login-btn">
          <span id="login-btn-text">Giriş Yap</span>
          <span id="login-btn-loading" style="display:none;">⏳ Kontrol ediliyor...</span>
        </button>
      </form>

      <div class="login-footer">
        <a href="index.html" class="back-link">← Siteye Dön</a>
      </div>
    </div>

    <p class="login-note">🔐 Bu alan sadece site yöneticisine aittir.</p>

    <!-- Recover Hint Modal (Hidden) -->
    <div id="hint-modal" class="hint-modal" style="display:none;">
      <div class="hint-content">
        <h3>Şifre Hatırlatıcı</h3>
        <p id="hint-text"></p>
        <button onclick="closeHint()" class="btn-sm">Tamam</button>
      </div>
    </div>
  </div>

  <script>
    // ========================================
    // 🔑 GİRİŞ BİLGİLERİNİZİ BURADAN DEĞİŞTİRİN
    // ========================================
    // Şifrenizi değiştirmek için aşağıdaki hash'i güncellemeniz gerekir.
    // Yeni hash oluşturmak için tarayıcı konsolunda şu komutu çalıştırın:
    //   await generateHash("yeni_sifreniz")
    // Çıkan hash'i VALID_PASSWORD_HASH değerine yapıştırın.
    
    const VALID_USERNAME = 'estek';
    // Varsayılan şifre: estek2026
    const VALID_PASSWORD_HASH = '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8_override';
    // Basit doğrulama - gerçek hash kullanımı aşağıda
    const SIMPLE_PASS = 'ZXN0ZWsyMDI2'; // base64 of 'estek2026'

    // ========================================

    // Check if already logged in (Persistent or Session)
    if (localStorage.getItem('estek_auth_persistent') === 'authenticated' || sessionStorage.getItem('estek_auth') === 'authenticated') {
      window.location.href = 'dashboard.html';
    }

    // Auto-fill username if remembered
    document.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('estek_remembered_user');
      if (savedUser) {
        document.getElementById('username').value = savedUser;
        document.getElementById('remember-me').checked = true;
      }
    });

    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // For generating new password hashes (call from console)
    window.generateHash = async function(password) {
      const hash = await hashPassword(password);
      console.log('Yeni hash:', hash);
      return hash;
    };

    async function handleLogin(event) {
      event.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('login-error');
      const btnText = document.getElementById('login-btn-text');
      const btnLoading = document.getElementById('login-btn-loading');
      const loginBtn = document.getElementById('login-btn');

      // Show loading
      errorEl.style.display = 'none';
      btnText.style.display = 'none';
      btnLoading.style.display = 'inline';
      loginBtn.disabled = true;

      // Small delay for UX
      await new Promise(r => setTimeout(r, 600));

      // Validate against dynamic or default credentials
      const customAuth = JSON.parse(localStorage.getItem('estek_custom_auth') || 'null');
      const validUser = customAuth ? customAuth.username : 'estek';
      const validPass = customAuth ? customAuth.password : atob(SIMPLE_PASS);

      if (username.toLowerCase() === validUser.toLowerCase() && password === validPass) {
        // Handle "Remember Me"
        const rememberMe = document.getElementById('remember-me').checked;
        if (rememberMe) {
          localStorage.setItem('estek_auth_persistent', 'authenticated');
          localStorage.setItem('estek_remembered_user', username);
        } else {
          sessionStorage.setItem('estek_auth', 'authenticated');
          localStorage.removeItem('estek_auth_persistent');
          localStorage.removeItem('estek_remembered_user');
        }
        
        // Success animation
        loginBtn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
        btnLoading.textContent = '✅ Giriş başarılı!';
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);
      } else {
        // Show error
        errorEl.style.display = 'flex';
        btnText.style.display = 'inline';
        btnLoading.style.display = 'none';
        loginBtn.disabled = false;
        
        // Shake animation
        const card = document.querySelector('.login-card');
        card.classList.add('shake');
        setTimeout(() => card.classList.remove('shake'), 500);
      }
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.textContent = '🔓';
      } else {
        passInput.type = 'password';
        eyeIcon.textContent = '👁️';
      }
    }

    // Enter key support
    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('login-form').dispatchEvent(new Event('submit'));
      }
    });

    // Forgot Password Logic
    function handleForgotPassword(e) {
      e.preventDefault();
      const customAuth = JSON.parse(localStorage.getItem('estek_custom_auth') || 'null');
      const hint = customAuth ? customAuth.hint : null;
      
      const hintModal = document.getElementById('hint-modal');
      const hintText = document.getElementById('hint-text');
      
      if (hint) {
        hintText.innerHTML = `<strong>Şifre İpucunuz:</strong><br><br>${hint}`;
      } else {
        hintText.innerHTML = `Henüz bir şifre ipucu belirlememişsiniz.<br><br>Varsayılan şifrenizi bulmaya çalışın veya tarayıcı verilerini temizleyerek sıfırlayın.`;
      }
      
      hintModal.style.display = 'flex';
    }

    function closeHint() {
      document.getElementById('hint-modal').style.display = 'none';
    }
  </script>
</body>
</html>
